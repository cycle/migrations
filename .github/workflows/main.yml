---

name: build

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 4.x
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlite:
    name: Unit and SQLite · PHP ${{ matrix.php-version }} · ${{ matrix.dependencies }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: Validate composer.json
        run: composer validate --ansi --strict

      - name: Install dependencies with composer
        # TODO(cycle/testing): switch to the released package
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Unit tests
        run: composer test:unit

      - name: SQLite tests
        env:
          DB_REQUIRED: 1
        run: composer test:sqlite

  coverage:
    name: Code coverage
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          ini-values: error_reporting=E_ALL
          coverage: pcov

      - name: Install dependencies with composer
        # TODO(cycle/testing): switch to the released package
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Collect code coverage
        env:
          DB_DRIVERS: sqlite
          DB_REQUIRED: 1
        run: composer test -- --coverage-clover=runtime/clover.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: runtime/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

...
